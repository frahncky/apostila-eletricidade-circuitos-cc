name: Compilar PDFs de estudo

on:
  push:
    branches: [main]
    paths:
      - 'apostila/**/*.tex'
      - '!apostila/gerado-questoes.tex'
      - '!apostila/gerado-resolucoes.tex'
      - 'apostila/**/*.sty'
      - 'apostila/gerar-pdfs-estudo.py'
      - 'apostila/revisar-portugues.py'
      - '.github/workflows/compilar-pdfs-estudo.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compilar:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v7

      - name: Revisar português e padronização editorial
        run: python3 apostila/revisar-portugues.py

      - name: Gerar fontes filtradas
        run: python3 apostila/gerar-pdfs-estudo.py

      - name: Gravar fontes revisados e arquivos do Overleaf
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          find apostila -type f \( -name '*.tex' -o -name '*.sty' \) -print0 | xargs -0 git add --
          if git diff --cached --quiet; then
            echo "Fontes revisados já estão atualizados."
          else
            git commit -m "revisa português nos fontes"
            git push
          fi

      - name: Compilar apostila e PDFs de estudo
        uses: xu-cheng/latex-action@v4
        with:
          working_directory: apostila
          root_file: |
            Livro.tex
            Questoes-Gabarito.tex
            Resolucoes.tex
          texlive_version: 2026
          os: debian

      - name: Validar e organizar saídas
        shell: bash
        run: |
          set -euo pipefail
          test -s apostila/Livro.pdf
          test -s apostila/Questoes-Gabarito.pdf
          test -s apostila/Resolucoes.pdf
          test "$(head -c 4 apostila/Livro.pdf)" = "%PDF"
          test "$(head -c 4 apostila/Questoes-Gabarito.pdf)" = "%PDF"
          test "$(head -c 4 apostila/Resolucoes.pdf)" = "%PDF"
          test -s apostila/gerado-questoes.tex
          test -s apostila/gerado-resolucoes.tex
          mkdir -p pdf
          cp apostila/Questoes-Gabarito.pdf pdf/Apostila-CC-Questoes-Gabarito.pdf
          cp apostila/Resolucoes.pdf pdf/Apostila-CC-Resolucoes.pdf

      - name: Disponibilizar PDFs como artefato
        uses: actions/upload-artifact@v7
        with:
          name: apostila-cc-estudo
          path: |
            apostila/Livro.pdf
            pdf/Apostila-CC-Questoes-Gabarito.pdf
            pdf/Apostila-CC-Resolucoes.pdf

      - name: Atualizar PDFs versionados
        shell: bash
        run: |
          set -euo pipefail
          git add pdf/Apostila-CC-Questoes-Gabarito.pdf pdf/Apostila-CC-Resolucoes.pdf
          if git diff --cached --quiet; then
            echo "PDFs já estão atualizados."
          else
            git commit -m "atualiza PDFs após revisão de português"
            git push
          fi
